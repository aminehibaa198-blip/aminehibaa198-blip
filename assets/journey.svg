<svg width="100%" viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#2b1055"/>
      <stop offset="100%" stop-color="#1a1636"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff6ec4"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#42e8e0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="230" rx="18" fill="url(#bgGrad)"/>

  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="25" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.7s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="45" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="20" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="55" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="30" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.0s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="50" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="22" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="60" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="190" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="205" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="195" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.9s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <text x="30" y="35" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#c9c3ff" letter-spacing="2">MY DEV JOURNEY // full-stack constellation</text>

  <path id="journeyPath" d="M50,150 C160,95 230,190 340,140 S480,90 560,150 S700,195 800,120 S920,150 950,140"
        stroke="url(#lineGrad)" stroke-width="3.5" fill="none" stroke-linecap="round"
        stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="4.5s" fill="freeze"/>
  </path>

  <circle r="6" fill="#ffffff">
    <animateMotion dur="4.5s" repeatCount="indefinite"
      path="M50,150 C160,95 230,190 340,140 S480,90 560,150 S700,195 800,120 S920,150 950,140"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle r="10" fill="#ff6ec4" opacity="0.35">
    <animateMotion dur="4.5s" repeatCount="indefinite"
      path="M50,150 C160,95 230,190 340,140 S480,90 560,150 S700,195 800,120 S920,150 950,140"/>
  </circle>

  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#f1efff" text-anchor="middle">
    <circle cx="50" cy="150" r="6" fill="#ff6ec4"/>
    <text x="50" y="175">HTML/CSS</text>

    <circle cx="340" cy="140" r="6" fill="#c084fc"/>
    <text x="340" y="165">JavaScript</text>

    <circle cx="560" cy="150" r="6" fill="#a78bfa"/>
    <text x="560" y="175">PHP</text>

    <circle cx="800" cy="120" r="6" fill="#60a5fa"/>
    <text x="800" y="105">Python</text>

    <circle cx="950" cy="140" r="6" fill="#42e8e0"/>
    <text x="950" y="165">SQL &amp; Git</text>
  </g>
</svg>
